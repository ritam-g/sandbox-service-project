# PURPOSE: Development-only Deployment for the AI service in Kind.
# WHY THIS EXISTS: Provide a small, debuggable pod that works well in low-resource Codespaces environments.
# DEVELOPMENT BENEFIT: Fast startup, small memory footprint, and predictable local iteration.
# PRODUCTION NOTE: Production should add stronger security, scaling, and rollout controls.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-deployment
  labels:
    app.kubernetes.io/name: ai
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: sandbox-service
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: sandbox-service
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: ai
          image: ai-server:latest
          imagePullPolicy: Never
          # Kind loads images from the local Docker daemon, so Never avoids unnecessary registry pulls.
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            # Explicit environment variable addition for LangChain/Mistral integration
            - name: MISTRAL_API_KEY
              value: "YOUR_MISTRAL_API_KEY_HERE" # 👈 Replace with your actual Mistral API key or use Kubernetes Secrets for better security in production.
          resources:
            requests:
              # Requests keep scheduling realistic without overcommitting scarce Codespaces RAM.
              cpu: 25m
              memory: 32Mi
            limits:
              # Limits are deliberately low to stay friendly to local laptops and Codespaces.
              cpu: 100m
              memory: 128Mi
          
          # -------------------------------------------------------------
          # STARTUP PROBE
          # -------------------------------------------------------------
          # Gives Node.js and its ESM dependencies ample time to safely
          # initialize without getting killed pre-maturely by Kubernetes.
          startupProbe:
            httpGet:
              path: /api/ai/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20

          # -------------------------------------------------------------
          # READINESS PROBE
          # -------------------------------------------------------------
          # Controls traffic routing. The pod enters service discovery
          # only when it actively handles endpoints.
          readinessProbe:
            httpGet:
              path: /api/ai/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # -------------------------------------------------------------
          # LIVENESS PROBE
          # -------------------------------------------------------------
          # Actively monitors deadlocks. Safely restarts the container
          # if the event loop freezes up entirely.
          livenessProbe:
            httpGet:
              path: /api/ai/healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3